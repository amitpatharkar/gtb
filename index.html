<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>GTB — Mumbai</title>
    <link rel="icon" href="./favicon.svg" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="hud">
      <div id="title">GTB · Mumbai</div>
      <div id="speed">0 km/h</div>
      <div id="road"></div>
      <div id="help">W A S D drive · Space brake · H horn · Tab map · P phone · J taxi duty · E snack · F refuel at ⛽ · T +1 hour · M mute · R reset · Q graphics</div>
    </div>
    <div id="status">
      <div id="clock">5:15 PM</div>
      <div id="aqi"></div>
      <div id="money">₹2,000</div>
      <div id="wanted"></div>
    </div>
    <div id="radar">
      <canvas id="minimap" width="220" height="220"></canvas>
      <div class="meter"><span>Fuel</span><div class="bar"><div id="fuel-bar"></div></div></div>
      <div class="meter"><span>Car</span><div class="bar"><div id="cond-bar"></div></div></div>
      <div class="meter"><span>Food</span><div class="bar"><div id="food-bar"></div></div></div>
      <div class="meter"><span>Energy</span><div class="bar"><div id="energy-bar"></div></div></div>
    </div>
    <div id="message"></div>
    <div id="job" hidden></div>
    <button id="btn-phone" aria-label="Phone">📱</button>
    <div id="loading">Loading Mumbai…</div>
    <div id="fade"></div>
    <div id="credit">
      Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>
      · <a href="#" id="credits-open">Credits</a>
      · <a href="#" id="quality" title="Change graphics quality (Q)">Graphics</a>
    </div>
    <div id="credits-panel" hidden>
      <div class="head">Credits <button class="close" aria-label="Close">✕</button></div>
      <div class="body">Loading…</div>
    </div>
    <div id="touch">
      <div class="pad left">
        <button data-key="left">◀</button>
        <button data-key="right">▶</button>
      </div>
      <div class="pad mid">
        <button id="btn-horn">📯</button>
        <button id="btn-fuel">⛽</button>
      </div>
      <div class="pad right">
        <button data-key="brake">■</button>
        <button data-key="back">▼</button>
        <button data-key="fwd">▲</button>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
