<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bombay Bawaal</title>
    <link rel="icon" href="/gtb/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="game"></div>

    <!-- Heads-up display (src/ui/hud.js) -->
    <div id="hud" hidden>
      <div id="messages"></div>
      <div id="weapon"><div id="weapon-name">Fists</div><div id="weapon-ammo"></div></div>
      <div id="radar">
        <canvas id="minimap" width="220" height="220"></canvas>
        <div id="street"></div>
        <div class="bars"><div class="bar health"><i></i></div><div class="bar armour"><i></i></div></div>
      </div>
      <div id="speedo" hidden><b id="speed">0</b><span>km/h</span><em id="gear">1</em></div>
      <div id="prompt" hidden></div>
      <div id="crosshair" hidden></div>
      <div id="vehicle-name"></div>
      <div id="osm">Map data © OpenStreetMap contributors</div>
      <div id="stats" hidden></div>
    </div>

    <!-- Loading screen -->
    <div id="loading">
      <div class="brand"><span>BOMBAY</span><b>BAWAAL</b></div>
      <div class="load-bar"><i id="load-fill"></i></div>
      <div id="load-text">Starting…</div>
      <div class="load-tip">Colaba · Apollo Bunder · Kala Ghoda</div>
    </div>

    <!-- Pause menu (src/ui/menu.js) -->
    <div id="pause" hidden>
      <div class="panel">
        <div class="brand small"><span>BOMBAY</span><b>BAWAAL</b></div>
        <nav>
          <button data-tab="resume" class="primary">Resume</button>
          <button data-tab="controls">Controls</button>
          <button data-tab="settings">Settings</button>
          <button data-tab="credits">Credits</button>
        </nav>
        <section id="tab-controls" hidden></section>
        <section id="tab-settings" hidden></section>
        <section id="tab-credits" hidden></section>
      </div>
    </div>

    <div id="click-to-play" hidden>Click to play</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
