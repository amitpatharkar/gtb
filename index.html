<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bombay Bawaal</title>
    <link rel="icon" href="/gtb/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="game"></div>

    <!-- Heads-up display (src/ui/hud.js). High-priority information stays; contextual information
         appears when it matters and leaves again (see docs/ui.md). -->
    <div id="hud" hidden>
      <div id="vignette"></div>
      <div id="top-left">
        <div id="objective" hidden><i></i><span></span></div>
        <div id="messages"></div>
      </div>
      <div id="top-right">
        <div id="weapon"><div id="weapon-icon"></div><div><div id="weapon-name">Fists</div><div id="weapon-ammo"></div></div></div>
        <div id="wanted" hidden></div>
      </div>
      <div id="radar">
        <canvas id="minimap" width="520" height="340"></canvas>
        <div id="radar-distance" hidden></div>
        <div class="strip"><div class="bar health"><i></i></div><div class="bar armour"><i></i></div><div class="bar stamina"><i></i></div></div>
      </div>
      <div id="bottom-right">
        <div id="area"><b id="area-name"></b><span id="street"></span></div>
        <div id="speedo" hidden><b id="speed">0</b><span>km/h</span><em id="gear">1</em></div>
      </div>
      <div id="vehicle-name"></div>
      <div id="prompt" hidden></div>
      <div id="crosshair" hidden></div>
      <div id="osm">Map data © OpenStreetMap contributors</div>
      <div id="stats" hidden></div>
    </div>

    <!-- Weapon wheel (hold Tab / LB): src/ui/weaponWheel.js -->
    <div id="wheel" hidden><div id="wheel-ring"></div><div id="wheel-centre"></div></div>

    <!-- Phone (P / d-pad up): src/ui/phone.js — a diegetic interface, part of the character's world -->
    <div id="phone" hidden><div class="screen"><div class="status"><span id="phone-time"></span><span>Kidhar Mobile</span></div><div id="phone-body"></div><div class="nav" id="phone-nav"></div></div></div>

    <!-- Wasted -->
    <div id="wasted" hidden><b>WASTED</b><span>Back on your feet at Apollo Bunder…</span></div>

    <!-- Loading screen -->
    <div id="loading">
      <div class="brand"><span>BOMBAY</span><b>BAWAAL</b></div>
      <div class="load-bar"><i id="load-fill"></i></div>
      <div id="load-text">Starting…</div>
      <div class="load-tip">Colaba · Apollo Bunder · Kala Ghoda</div>
    </div>

    <!-- Pause menu (src/ui/menu.js): Map, Brief, Stats, Settings, Game -->
    <div id="pause" hidden>
      <header>
        <div class="brand small"><span>BOMBAY</span><b>BAWAAL</b></div>
        <div id="pause-info"></div>
      </header>
      <nav id="pause-tabs"></nav>
      <main id="pause-body"></main>
      <footer id="pause-hints"></footer>
    </div>

    <div id="click-to-play" hidden>Click to play</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
